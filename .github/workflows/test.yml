name: Tests automatiques

# Se lance à chaque envoi sur GitHub (push) ou pull request, sans rien à
# installer côté utilisateur : GitHub fournit la machine, Node et npm.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {} # permet aussi de le relancer manuellement depuis l'onglet Actions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances (jsdom)
        run: npm install

      - name: Lancer les tests
        run: npm test
